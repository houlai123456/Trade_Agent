server:
  port: 8080

spring:
  application:
    name: trading-helper
  # 数据源 - 默认使用H2内存数据库，方便本地启动
  # 切换MySQL时激活mysql profile
  datasource:
    url: jdbc:h2:file:./data/trading_helper;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: true

  # Redis配置
  redis:
    enabled: true          # 设为 false 完全禁用 Redis 缓存
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      connect-timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: 3000ms
          max-idle: 8
          min-idle: 0

  # Spring AI - DeepSeek (OpenAI兼容接口)
  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:sk-placeholder}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7

# 飞书消息推送
feishu:
  app-id: ${FEISHU_APP_ID:}
  app-secret: ${FEISHU_APP_SECRET:}
  target-open-id: ${FEISHU_TARGET_OPEN_ID:}

# RAG 配置
rag:
  aliyun:
    api-key: ${ALIYUN_API_KEY:}
  qdrant:
    url: http://localhost:6333

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.quantai.model.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志
logging:
  level:
    com.quantai: debug
    org.springframework.ai: debug

# Actuator / Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

---
# MySQL配置 - 通过 --spring.profiles.active=mysql 激活
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/trading_helper?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  h2:
    console:
      enabled: false
